# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(DATAPULSE_INVITE_KEYS): 'DP-DEMO-2026,DP-VIP-ACCESS'
    app.max_upload_size: '%env(int:MAX_UPLOAD_SIZE)%'
    app.dataset_storage_dir: '%env(resolve:DATASET_STORAGE_DIR)%'
    app.dataset_tmp_dir: '%env(resolve:DATASET_TMP_DIR)%'
    app.data_engine_url: '%env(resolve:DATA_ENGINE_URL)%'
    app.invite_keys: '%env(string:DATAPULSE_INVITE_KEYS)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            int $maxUploadSize: '%app.max_upload_size%'
            string $rootDir: '%app.dataset_storage_dir%'
            string $tmpDir: '%app.dataset_tmp_dir%'
            string $dataEngineBaseUrl: '%app.data_engine_url%'
            string $inviteKeys: '%app.invite_keys%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Kernel.php'
            - '../src/Presentation/'
            - '../src/Upload/ValidationResult.php'
            - '../src/Upload/IngestionResult.php'
            - '../src/Upload/UploadRejectedException.php'
            - '../src/Profiling/DataEngineException.php'
            - '../src/Cleaning/Operation.php'
            - '../src/Cleaning/PipelineValidationException.php'

    App\Storage\DatasetStorageInterface:
        class: App\Storage\LocalFilesystemDatasetStorage

    App\Profiling\DataEngineClientInterface:
        class: App\Profiling\HttpDataEngineClient

    App\Ai\AiClientInterface:
        class: App\Ai\RuleBasedAiClient

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Real dockerized data-engine calls need a shared storage volume
        # (see docker-compose.yml) that a natively-run PHPUnit process
        # doesn't have — a fake keeps DatasetProfilingService/CleaningService
        # tests deterministic and independent of Docker. Actual profiling
        # and cleaning correctness is covered by the data engine's own test
        # suite and by manual full-stack Docker verification each phase.
        App\Profiling\DataEngineClientInterface:
            class: App\Tests\Support\FakeDataEngineClient
            # when@test's `services:` block doesn't inherit the main
            # `_defaults.bind` rules, so $tmpDir needs to be wired explicitly.
            arguments:
                $tmpDir: '%app.dataset_tmp_dir%'
