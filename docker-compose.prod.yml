services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datapulse}
      POSTGRES_USER: ${POSTGRES_USER:-datapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-datapulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datapulse
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  data-engine:
    build: ./data-engine
    restart: unless-stopped
    environment:
      DATA_ENGINE_ENVIRONMENT: prod
      DATA_ENGINE_STORAGE_DIR: /app/storage/datasets
      DATA_ENGINE_TMP_DIR: /app/storage/tmp
      DATA_ENGINE_MAX_PROFILABLE_BYTES: ${MAX_PROFILABLE_BYTES:-26214400}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - backend_storage:/app/storage
    networks:
      - datapulse
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-datapulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datapulse}?serverVersion=16&charset=utf8
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://.*$$}
      DATA_ENGINE_URL: http://data-engine:8001
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
      AUTO_MIGRATE: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      data-engine:
        condition: service_healthy
    volumes:
      - backend_storage:/app/var/storage
      - backend_jwt:/app/config/jwt
    networks:
      - datapulse
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - datapulse
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  datapulse:
    driver: bridge

volumes:
  postgres_data:
  backend_storage:
  backend_jwt:
